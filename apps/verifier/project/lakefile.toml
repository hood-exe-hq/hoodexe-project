name = "hoodverifier"
defaultTargets = ["hoodcheck"]

# Mathlib pinned to the toolchain in lean-toolchain; bump both together.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

# The trusted checker: loads a compiled proof without running its code, replays it through the kernel and lists
# each theorem's axioms (HoodCheck.lean).
[[lean_exe]]
name = "hoodcheck"
root = "HoodCheck"
