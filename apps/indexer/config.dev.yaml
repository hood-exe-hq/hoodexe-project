# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Local development: same contracts, starting near the chain head so the free HyperSync token (5 requests/min) keeps up.
name: hood-exe
handlers: ./src/handlers
contracts:
  - name: PonsV2Factory
    events:
      - event: TokenLaunched(address indexed token, address indexed curve, address indexed deployer, address pairToken, uint256 launchConfigId, uint256 graduationThreshold)
      - event: LaunchSwept(address indexed token, uint256 quoteOut, uint256 tokenOut)
      - event: PoolGraduated(address indexed token, uint256 positionId, uint256 tokenAmount, uint256 pairTokenAmount)
  # One per launch. Handlers match its events by signature (wildcard) and check the Curve table, so no addresses.
  - name: PonsV2Curve
    events:
      - event: CurveBuy(address indexed buyer, address indexed recipient, uint256 quoteIn, uint256 tokensOut, uint256 fee, uint256 tax)
        field_selection:
          transaction_fields:
            - hash
      - event: CurveSell(address indexed seller, address indexed recipient, uint256 tokensIn, uint256 quoteOut, uint256 fee, uint256 tax)
        field_selection:
          transaction_fields:
            - hash
  # Formal verification (hood-exe-formal-verification-brief.md §6). Not deployed yet: their chain entries below are
  # commented out until the contracts are reviewed and deployed.
  - name: VerificationPool
    events:
      - event: Submitted(bytes32 indexed id, address indexed submitter, address indexed token, bytes32 proofHash, string ipfsCid)
        field_selection:
          transaction_fields:
            - hash
      - event: Verified(bytes32 indexed id, uint8 tier, uint256 reward)
        field_selection:
          transaction_fields:
            - hash
      - event: Failed(bytes32 indexed id, string reason)
      - event: Refunded(bytes32 indexed id, uint256 amount)
  - name: RigorRegistry
    events:
      - event: FormalVerificationUpgrade(address indexed token)
      - event: FormalVerificationRevoked(address indexed token, string reason)
chains:
  - id: 4663
    # About an hour before this file was written; raise it, or use "latest", to start fresher.
    start_block: 83990000
    contracts:
      - name: PonsV2Factory
        address: "0x7eD598BcEf8bd9Edd8C97A195C6d13f40801EC7e"
      - name: PonsV2Curve
      # Formal verification: uncomment with the addresses from apps/contracts/script/Deploy.s.sol.
      # - name: VerificationPool
      #   address: "0x…"
      # - name: RigorRegistry
      #   address: "0x…"
